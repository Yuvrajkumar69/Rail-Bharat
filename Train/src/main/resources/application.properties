spring.application.name=Rail-Bharat
server.port=8080

# MySQL - set DB_PASSWORD as an environment variable for a real deployment.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/rail_bharat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
server.error.include-binding-errors=always

management.endpoints.web.exposure.include=health,info
# ==================================================
# RAZORPAY
# ==================================================

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# ==================================================
# EMAIL / SMTP
# ==================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
